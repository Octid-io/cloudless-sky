[package]
name = "osmp"
version = "0.1.0"
edition = "2021"
description = "OSMP — Octid Semantic Mesh Protocol. Bandwidth-agnostic semantic instruction encoding."
license = "Apache-2.0"
repository = "https://github.com/octid-io/cloudless-sky"
readme = "README.md"
keywords = ["semantic", "protocol", "encoding", "instruction", "wire-format"]
categories = ["encoding", "parser-implementations"]

[lib]
name = "osmp"
path = "src/lib.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
